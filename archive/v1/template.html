er-top:1px solid var(--line);padding-top:14px;font-size:16px;color:var(--muted)}.footer a{text-decoration:none;margin-right:20px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:25px;line-height:1.45}th{text-align:left;color:var(--cyan);font-weight:600;border-bottom:2px solid #60758a;padding:14px 15px}td{padding:20px 15px;border-bottom:1px solid var(--line)}tbody tr:nth-child(even){background:#142337}.flow{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:25px 0 35px}.node{border:1px solid #60758a;padding:22px 17px;flex:1;text-align:center;font-size:25px;line-height:1.4}.arrow{color:var(--cyan);font-size:30px}.stack{display:grid;gap:13px}.stack>div{border-bottom:1px solid var(--line);display:grid;grid-template-columns:420px 1fr;padding:18px 25px}.stack b{color:var(--cyan)}.stack span{color:var(--ink)}.formula{font-family:"Cambria Math","Segoe UI","Microsoft JhengHei",sans-serif;font-size:34px;padding:22px 0;color:var(--cyan);line-height:1.35}.big{font-size:125px;line-height:1.15;color:var(--cyan);font-weight:650;margin:10px 0 30px}.big span{display:block;font-size:26px;color:var(--muted);font-weight:400}.layerpattern{display:flex;gap:8px;margin:38px 0}.layerpattern span{background:#254453;color:var(--cyan);padding:20px;flex:1;text-align:center}.layerpattern .attn{background:#484032;color:var(--amber)}.cover h1{font-size:80px;margin-top:85px}.cover .subtitle{font-size:32px}.cover .body{top:380px}.coverline{font-size:38px;margin:15px 0}.covermeta{font-size:23px;color:var(--cyan);margin-top:85px;line-height:1.8}.agenda>div{display:grid;grid-template-columns:110px 1fr 160px;padding:21px 0;border-bottom:1px solid var(--line);align-items:center}.agenda b{font-size:42px;color:var(--cyan)}.agenda span{font-size:34px}.agenda small{color:var(--muted);font-size:23px}.provided{width:100%;height:525px;object-fit:contain;background:#fff;border-radius:3px}.statement{font-size:40px;line-height:1.65;margin:20px 0 35px}.sourcegrid{display:grid;grid-template-columns:1fr 1fr;gap:13px 50px;font-size:21px}.sourcegrid a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}pre{font:23px/1.65 Consolas,monospace;background:#0b1625;border-left:3px solid var(--cyan);padding:22px;white-space:pre-wrap;margin:12px 0}
nav{height:54px;position:fixed;bottom:0;left:0;right:0;display:flex;gap:9px;align-items:center;padding:7px 20px;background:#07101b;border-top:1px solid var(--line);font-size:15px}nav button{padding:5px 13px}#progress{position:fixed;bottom:54px;height:3px;background:var(--cyan);left:0;transition:width .2s}#counter{margin:0 15px;min-width:80px}#hint{margin-left:auto;color:var(--muted)}dialog{color:var(--ink);background:#17263b;border:1px solid #56718b;width:min(1100px,90vw);max-height:85vh;padding:30px}dialog::backdrop{background:#000a}dialog h2{margin-top:0}dialog p{font-size:20px;line-height:1.8}#contents{display:grid;grid-template-columns:1fr 1fr;gap:10px}#contents button{text-align:left;font-size:17px}.dialogclose{float:right}.demo{height:100%;position:relative}.demo-toolbar{display:flex;align-items:center;gap:13px;margin-bottom:22px;font-size:23px;min-height:44px}.demo-toolbar label{margin-left:12px}.demo-toolbar input[type=range]{width:230px;accent-color:var(--cyan)}.demo-status{color:var(--amber);font-size:27px;min-height:76px;line-height:1.4;margin:20px 0 0}.tokenrow{display:flex;gap:10px;margin:22px 0;align-items:center;min-height:68px}.token{display:inline-grid;place-items:center;background:#214556;color:var(--cyan);min-width:92px;height:61px;padding:0 15px;border:1px solid #4f8e9c;transition:background .3s,opacity .3s,transform .3s}.token.new{background:#62482b;color:var(--amber);border-color:var(--amber)}.token.ghost{opacity:.2}.label{font-size:23px;color:var(--muted);min-width:170px}.compute{border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:25px 10px;display:flex;justify-content:space-around;align-items:center;font-size:29px}.active-node{background:#395564!important;color:#fff!important;border-color:var(--cyan)!important;box-shadow:0 0 0 2px #59d8df55}.matrix{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:360px;height:270px}.matrix span{transition:background .4s;background:#315367;border-radius:2px}.matrixwrap{display:flex;gap:55px;align-items:center;justify-content:space-around;margin-top:15px}.matrixlabel{text-align:center;font-size:25px;margin-top:15px}.experts{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;margin:40px 0}.expert{border:1px solid var(--line);text-align:center;padding:28px 10px;color:var(--muted);transition:all .3s}.expert.selected{background:#254a52;color:var(--cyan);border-color:var(--cyan)}.routerline{text-align:center;font-size:32px;padding:15px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}.chart{width:100%;height:330px;display:block}.chart text{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;fill:var(--muted);font-size:20px}.chart .legend{font-size:21px}.metricrow{display:flex;gap:35px;margin:22px 0}.metric{flex:1;border-top:2px solid var(--line);padding-top:16px}.metric b{display:block;font-size:44px;line-height:1.3;color:var(--cyan)}.metric span{font-size:22px;color:var(--muted)}.barrow{display:grid;grid-template-columns:285px 1fr 170px;align-items:center;gap:22px;margin:25px 0;font-size:23px}.bartrack{height:36px;background:#23354b;position:relative}.barfill{height:100%;background:var(--cyan);transition:width .3s}.lane{display:flex;align-items:center;gap:18px;margin:18px 0}.lane-name{width:120px;color:var(--muted)}.lane-track{height:39px;flex:1;background:#203146;position:relative}.job{height:39px;background:#3a8c94;position:absolute;border:1px solid #73c8cc;color:white;text-align:center;font-size:21px;white-space:nowrap;overflow:hidden}.queue{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start;min-height:110px;margin-top:15px}.queue span{width:42px;height:42px;background:#514632;color:var(--amber);font-size:19px;display:grid;place-items:center}.stepcount{color:var(--muted);font-size:20px;margin-left:auto}.readout{color:var(--cyan);font-size:27px}.slo-table{font-size:21px}.slo-table td{padding:12px}.pass{color:var(--green)}.fail{color:#ffa898}.modelbuttons button[aria-pressed=true]{border-color:var(--cyan);color:var(--cyan)}
.demo[data-demo="timeline"] .chart,.demo[data-demo="slo"] .chart,.demo[data-demo="closed"] .chart{height:250px}
@media print{@page{size:16.6667in 9.375in;margin:0}html,body{width:1600px;height:auto;overflow:visible;background:var(--paper);print-color-adjust:exact;-webkit-print-color-adjust:exact}#viewport{display:block;position:static;height:auto}.slide,.slide.active{display:block;transform:none;width:1600px;height:900px;page-break-after:always;break-after:page}.slide:last-child{break-after:auto;page-break-after:auto}nav,#progress,dialog{display:none!important}.demo-toolbar button{display:none}.demo-toolbar input,.demo-toolbar select{pointer-events:none}.footer{font-size:16px}}

</style></head>
<body><main id="viewport" aria-label="簡報"></main><div id="progress"></div><nav aria-label="簡報控制"><button id="prev" title="←">上一頁</button><span id="counter"></span><button id="next" title="→">下一頁</button><button id="step" title="Space">動畫下一步</button><button id="overview" title="O">目錄</button><button id="notes" title="N">講者筆記</button><button id="full" title="F">全螢幕</button><button id="print">列印 / PDF</button><span id="hint">← → 換頁　Space 演示　N 筆記</span></nav>
<dialog id="toc"><button class="dialogclose" onclick="this.parentElement.close()">關閉</button><h2>簡報目錄</h2><div id="contents"></div></dialog><dialog id="notedialog"><button class="dialogclose" onclick="this.parentElement.close()">關閉</button><h2 id="notetitle"></h2><p id="notetext"></p><div id="notelinks"></div></dialog>
<script>
const slides=@@SLIDES@@;
const sources=@@SOURCES@@;
const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>Array.from(root.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('#viewport');
main.innerHTML=slides.map((s,i)=>`<section class="slide ${s.kind}" id="slide-${i+1}" aria-label="${i+1}. ${esc(s.title)}"><h1>${s.title}</h1><p class="subtitle">${s.sub}</p><div class="body">${s.body}</div><footer class="footer"><span>${s.sources.map(k=>`<a href="${sources[k][1]}" target="_blank" rel="noopener">${sources[k][0]}</a>`).join('')}</span><span>${String(i+1).padStart(2,'0')} / ${slides.length}</span></footer></section>`).join('');
let index=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1));
const controllers=new Map();
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,(innerHeight-58)/900));}
function go(n){index=Math.max(0,Math.min(slides.length-1,n));$$('.slide').forEach((s,i)=>s.classList.toggle('active',i===index));if(document.activeElement?.closest('.slide')&&!document.activeElement.closest('.slide').classList.contains('active'))document.activeElement.blur();$('#counter').textContent=`${index+1} / ${slides.length}`;$('#progress').style.width=`${(index+1)/slides.length*100}%`;history.replaceState(null,'','#'+(index+1));controllers.forEach(c=>c.pause());$('#step').disabled=!slides[index].demo;resize();}
function activeControl(){return controllers.get(slides[index].demo);}
$('#prev').onclick=()=>go(index-1);$('#next').onclick=()=>go(index+1);$('#step').onclick=()=>activeControl()?.next();
$('#overview').onclick=()=>$('#toc').showModal();$('#notes').onclick=()=>{const s=slides[index];$('#notetitle').textContent=s.title;$('#notetext').textContent=s.notes;$('#notelinks').innerHTML=s.sources.map(k=>`<p><a href="${sources[k][1]}" target="_blank">${sources[k][0]}</a></p>`).join('');$('#notedialog').showModal();};
$('#full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
$('#print').onclick=()=>window.print();
$('#contents').innerHTML=slides.map((s,i)=>`<button data-page="${i}">${String(i+1).padStart(2,'0')}　${s.title}</button>`).join('');
$$('#contents button').forEach(b=>b.onclick=()=>{$('#toc').close();go(+b.dataset.page);});
addEventListener('resize',resize);addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));
addEventListener('keydown',e=>{if($('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();go(index+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1);}if(e.code==='Space'){e.preventDefault();if(activeControl())activeControl().next();else go(index+1);}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='n')$('#notes').click();if(e.key.toLowerCase()==='o')$('#overview').click();if(e.key.toLowerCase()==='f')$('#full').click();});
function metric(v,l,c=''){return `<div class="metric"><b class="${c}">${v}</b><span>${l}</span></div>`;}
function controls(root,max,render,extra=''){
 let step=0,timer=null;
 root.innerHTML=`<div class="demo-toolbar"><button class="advance">下一步</button><button class="play">播放</button><button class="reset">重播</button>${extra}<span class="stepcount"></span></div><div class="scene"></div>`;
 const scene=$('.scene',root);function draw(){render(scene,step);$('.stepcount',root).textContent=`${step+1} / ${max+1}`;}
 const c={next(){step=step>=max?0:step+1;draw();},pause(){if(timer)clearInterval(timer);timer=null;$('.play',root).textContent='播放';},finish(){c.pause();step=max;draw();},reset(){c.pause();step=0;draw();},draw,step:()=>step};
 $('.advance',root).onclick=c.next;$('.reset',root).onclick=c.reset;$('.play',root).onclick=()=>{if(timer)c.pause();else{if(step===max)step=0;$('.play',root).textContent='暫停';timer=setInterval(()=>{if(step>=max){c.pause();return;}step++;draw();},1200);}};draw();return c;
}
const tok=(t,cl='')=>`<span class="token ${cl}">${t}</span>`;
function createDemo(name,root){
if(name==='tokens')return controls(root,5,(scene,s)=>{
 const labels=['Prompt 已知，可同時處理各位置。','Prefill 通過所有 decoder layers，建立各層 KV。','由 prompt 最後位置抽樣第一個 output token「E」。','將 E 送入模型，讀取歷史 KV 並追加 E 的 K/V。','抽樣 F，再將 F 送入下一輪 decode。','抽樣 G。若此處結束，G 尚不需要再寫入 KV。'];
 scene.innerHTML=`<div class="tokenrow"><span class="label">已知 prompt</span>${['A','B','C','D'].map(t=>tok(t)).join('')}</div><div class="compute ${s===1||s===3||s===4?'active-node':''}">Embedding　→　Decoder layers × L　→　LM head / sampling</div><div class="tokenrow"><span class="label">生成 output</span>${['E','F','G'].map((t,i)=>tok(t,(s<(i===0?2:i===1?4:5)?'ghost ':'')+'new')).join('')}</div><div class="tokenrow small"><span class="label">已存 KV 位置</span><span class="cyan">${s===0?'尚未建立':s<3?'A B C D':s<4?'A B C D E':'A B C D E F'}</span></div><p class="demo-status">${labels[s]}</p>`;});
if(name==='kv')return controls(root,4,(scene,s)=>{scene.innerHTML=`<div class="tokenrow"><span class="label">目前 hidden xₜ</span>${tok('xₜ','new')}<span>　投影為　</span>${tok('qₜ',s>=1?'new':'ghost')}${tok('kₜ',s>=1?'new':'ghost')}${tok('vₜ',s>=1?'new':'ghost')}</div><div class="tokenrow"><span class="label">K cache</span>${['k₁','k₂','k₃','k₄'].map(t=>tok(t,s===3?'new':'')).join('')}${tok('kₜ',s>=2?'new':'ghost')}</div><div class="tokenrow"><span class="label">V cache</span>${['v₁','v₂','v₃','v₄'].map(t=>tok(t,s===3?'new':'')).join('')}${tok('vₜ',s>=2?'new':'ghost')}</div><div class="formula">oₜ = softmax(qₜ Kᵀ / √d) V</div><p class="demo-status">${['一層 attention，既有 cache 已保留歷史位置。','只計算目前位置的 q、k、v。','把新的 k、v 加入此層 cache。','目前 query 讀取歷史與目前位置的 K/V。','Output projection 與 residual 後繼續下一層；Q 不需持久快取。'][s]}</p>`;});
if(name==='moe')return controls(root,4,(scene,s)=>{scene.innerHTML=`<div class="routerline">hidden xₜ　→　router scores　→　Top-2（8 個 experts 的教學示意）</div><div class="experts">${Array.from({length:8},(_,i)=>`<div class="expert ${s>=2&&[2,6].includes(i)?'selected':''}">E${i+1}${s>=1?'<br><small>'+[.03,.04,.51,.03,.04,.05,.27,.03][i].toFixed(2)+'</small>':''}</div>`).join('')}</div><div class="compute">${s<3?'選到的 experts 分別執行 FFN':'0.65 × E3(xₜ) + 0.35 × E7(xₜ)'}${s===4?'　→　合併輸出':''}</div><p class="demo-status">${['Dense 路徑使用同一個 FFN；MoE 先執行 router。','Router 依目前 token 的 hidden state 給分。','選出 E3 與 E7，其餘 experts 對這個 token 不計算。','選取後權重重新正規化，組合 expert 輸出。','下一個 token 或 layer 可以選不同 experts。Qwen122B 實際為 8 routed + 1 shared。'][s]}</p>`;});
if(name==='state')return controls(root,4,(scene,s)=>{const matrix=(which)=>`<div><div class="matrix">${Array.from({length:24},(_,i)=>`<span style="background:hsl(${which?185:204},${which?35+s*7:32}%,${18+((i*7+(which?s*11:0))%28)}%)"></span>`).join('')}</div><div class="matrixlabel">${which?'Sₜ：同樣的維度':'Sₜ₋₁：舊 state'}</div></div>`;scene.innerHTML=`<div class="matrixwrap">${matrix(false)}<div class="formula" style="font-size:29px;text-align:center">${['qₜ, kₜ, vₜ<br>αₜ, βₜ','S̄ = αₜ Sₜ₋₁','rₜ = vₜ − S̄ kₜ','Sₜ = S̄ + βₜ rₜ kₜᵀ','oₜ = Sₜ qₜ'][s]}</div>${matrix(true)}</div><p class="demo-status">${['輸入經 projection、short conv 與 normalization，產生本步資料。','Decay gate 調整舊記憶的保留程度。','利用 k 查詢舊 state，計算要修正的 value 殘差。','以 delta rule 更新矩陣；沒有新增一整列歷史 tokens。','用 q 讀出結果，再經 output gate / projection；conv history 也要延續。'][s]}</p><p class="caption">概念動畫，色彩只表示 state 更新。矩陣元素沒有實測或語意對應。</p>`;});
if(name==='hybrid'){let model='moe';const c=controls(root,5,(scene,s)=>{const m=model==='moe';scene.innerHTML=`<div class="layerpattern">${['GDN + '+(m?'MoE':'FFN'),'GDN + '+(m?'MoE':'FFN'),'GDN + '+(m?'MoE':'FFN'),'Attention + '+(m?'MoE':'FFN')].map((t,i)=>`<span class="${i===3?'attn ':''}${s===i+1?'active-node':''}">${t}</span>`).join('')}</div><div class="metricrow">${metric(m?'36 層':'48 層','更新 recurrent + conv state')}${metric(m?'12 層':'16 層','讀寫 full-attention KV','amber')}${metric(m?'12 組':'16 組','四層 group')}</div><p class="demo-status">${['目前 token 的 hidden state 進入第一組。','第一層：GDN 更新 state，接著執行 '+(m?'MoE routing 與 experts。':'dense FFN。'),'第二層：使用這一層自己的 state，沒有與上一層共用。','第三層：再做一次 GDN 與 '+(m?'MoE。':'dense FFN。'),'第四層：讀取與追加歷史 KV，接著執行 '+(m?'MoE。':'dense FFN。'),'所有 groups 完成後，final norm / LM head 產生下一 token 的分布。'][s]}</p>`;},'<span class="modelbuttons"><button data-model="moe" aria-pressed="true">122B-A10B</button><button data-model="dense" aria-pressed="false">27B</button></span>');$$('[data-model]',root).forEach(b=>b.onclick=()=>{model=b.dataset.model;$$('[data-model]',root).forEach(x=>x.setAttribute('aria-pressed',x===b));c.draw();});return c;}
if(name==='memory'){
 root.innerHTML='<div class="demo-toolbar"><label>Context <input type="range" min="1" max="32" value="32" aria-label="Context 千 token"></label><span class="readout"></span><span class="stepcount">公式推導，非實測</span></div><div class="scene"></div>';
 const draw=()=>{const t=+$('input',root).value*1024;$('.readout',root).textContent=t.toLocaleString()+' tokens';const values=cache(t);$('.scene',root).innerHTML=values.map((v,i)=>`<div class="barrow"><span>${['Qwen3-32B','122B-A10B','27B'][i]}</span><div class="bartrack"><div class="barfill" style="width:${v/8*100}%;background:${colors[i]}"></div></div><span>${v.toFixed(3)} GiB</span></div>`).join('')+`<div class="metricrow">${metric('C × cache','多序列無共享時按數量增加')}${metric('KV ∝ T','Full attention 歷史增長','amber')}${metric('State ∝ C','固定大小指的是每條序列','purple')}</div><p class="caption">包含 BF16 KV、FP32 recurrent matrices、BF16 conv history。全模型合計，無分片、無 prefix sharing、無 speculative buffers。</p>`;};$('input',root).oninput=draw;draw();return {pause(){},next(){const x=$('input',root);x.value=+x.value>=32?1:Math.min(32,+x.value*2);draw();},finish:draw};}
if(name==='timeline')return controls(root,4,(scene,s)=>{scene.innerHTML=`<svg class="chart" viewBox="0 0 1440 300" role="img" aria-label="Token 到達時間軸"><line x1="90" x2="1350" y1="120" y2="120" stroke="#60758a" stroke-width="3"/>${[[90,'0','送出'],[600,'0.80','Token 1'],[755,'0.83','Token 2'],[910,'0.88','Token 3'],[1065,'0.91','Token 4'],[1220,'1.00','Token 5'],[1350,'1.02','完成']].map(([x,t,l],i)=>`<circle cx="${x}" cy="120" r="9" fill="${i===0?'#a9b9cc':colors[1]}"/><text x="${x}" y="88" text-anchor="middle">${t}s</text><text x="${x}" y="161" text-anchor="middle">${l}</text>`).join('')}<line x1="90" x2="600" y1="215" y2="215" stroke="${colors[0]}" stroke-width="6"/><text x="340" y="253" text-anchor="middle">TTFT = 800 ms</text><text x="980" y="253" text-anchor="middle">ITLs = 30, 50, 30, 90 ms</text></svg><div class="metricrow">${metric(s>=1?'1.02 s':'—','E2EL，至完成')}${metric(s>=2?'55 ms':'—','TPOT = (1.02−0.80) / 4','amber')}${metric(s>=3?'50 ms':'—','四個 token intervals 的平均','purple')}</div><p class="demo-status">${['時間軸不按比例。TTFT 包含網路、排隊、前處理與模型工作。','最後 token 在 1.00 秒抵達，完成事件在 1.02 秒。','若 E2EL 採完成時間，TPOT = 220 / 4 = 55 ms。','逐 token 間隔合計 200 ms，平均 50 ms；收尾時間造成差異。','工具與 backend 的計時邊界必須記錄，才能比較各次結果。'][s]}</p>`;});
if(name==='closed')return controls(root,8,(scene,s)=>{if(s===8){const rs=[.20,.36,.67,1.14,1.60,1.78,1.78,1.70];scene.innerHTML=`<svg class="chart" viewBox="0 0 1440 330" role="img" aria-label="示意 concurrency 與 achieved RPS 飽和曲線"><line x1="120" x2="1320" y1="255" y2="255" stroke="#60758a"/><line x1="120" x2="120" y1="35" y2="255" stroke="#60758a"/><text x="120" y="22">Achieved RPS</text>${[0,.5,1,1.5,2].map(v=>`<text x="100" y="${261-v*100}" text-anchor="end">${v}</text>`).join('')}${rs.map((v,i)=>`<circle cx="${160+i*155}" cy="${255-v*100}" r="7" fill="${colors[0]}"/><text x="${160+i*155}" y="286" text-anchor="middle">${2**i}</text>`).join('')}<polyline points="${rs.map((v,i)=>`${160+i*155},${255-v*100}`).join(' ')}" fill="none" stroke="${colors[0]}" stroke-width="4"/><text x="1320" y="323" text-anchor="end">Concurrency（倍增刻度）</text><text x="980" y="53" text-anchor="middle">吞吐逐漸飽和</text></svg><div class="metricrow">${metric('C = 32','18 s 平均 E2E，1.78 RPS')}${metric('C = 64','36 s 平均 E2E，1.78 RPS','amber')}</div><p class="demo-status">提高 concurrency 後，完成率可能幾乎不再增加，但 request 等待更久。</p><p class="caption">教學示意，非 B200 實測。C ≈ X × R 用於穩態一致性檢查。</p>`;return;}scene.innerHTML=`<div class="small muted">C = 4，完成一個才補下一個。以下為排程概念，非 GPU trace。</div>${Array.from({length:4},(_,i)=>{const durations=[3,2,4,3];let start=0,id=i+1,jobs=[];for(let j=0;j<5;j++){let end=start+durations[i];if(start<=s)jobs.push(`<div class="job" style="left:${start/12*100}%;width:${Math.min(durations[i],Math.max(.2,s-start))/12*100}%">R${id}</div>`);start=end;id+=4;}return `<div class="lane"><span class="lane-name">Slot ${i+1}</span><div class="lane-track">${jobs.join('')}</div></div>`;}).join('')}<div class="metricrow">${metric('4','控制中的 outstanding 上限')}${metric(s+' s','示意時間','amber')}${metric('N_done / Δt','Achieved RPS 的計算')}</div><p class="demo-status">RPS 是結果。C 增加後，吞吐可能先上升再飽和，latency 仍可能繼續增加。</p>`;});
if(name==='open'){
let offered=2;const c=controls(root,8,(scene,s)=>{const arrival=offered*s,done=Math.min(arrival,s),queue=Math.max(0,arrival-done-(s?1:0));scene.innerHTML=`<div class="compute">外界每秒 ${offered} 筆　→　Queue　→　單服務槽位每秒完成 1 筆</div><div class="metricrow">${metric(arrival,'累積到達')}${metric(done,'累積完成','amber')}${metric(queue,'等待中（另有至多 1 筆執行）','purple')}</div><div class="queue">${Array.from({length:queue},(_,i)=>`<span>${i+1}</span>`).join('')||'<span style="background:transparent;width:auto">目前無等待隊列</span>'}</div><p class="demo-status">${offered>1?'到達率超過處理率，等待隊列隨時間增長。完成後不會限制外界的新到達。':'本例到達率等於處理率且完全均勻。真實隨機 arrivals 仍會排隊，不能照此推論 SLO。'}</p><p class="caption">教學排隊示例。真實 Stage 2 需檢查 sent rate、queue trend、timeouts 與 tail latency。</p>`;},'<label>到達率 <select aria-label="到達率"><option value="2">2 req/s</option><option value="1">1 req/s</option><option value="3">3 req/s</option></select></label>');$('select',root).onchange=e=>{offered=+e.target.value;c.reset();};return c;}
if(name==='slo'){
const points=[[.5,340,500,90,180],[1,390,650,120,240],[2,460,750,140,275],[4,700,1050,180,340],[3,530,850,149,295],[3.5,610,940,164,315],[3.25,580,890,155,305]];
return controls(root,6,(scene,s)=>{const p=points[s],pass=p[1]<=600&&p[2]<=900&&p[3]<=150&&p[4]<=300;scene.innerHTML=`<svg class="chart" viewBox="0 0 1440 310" role="img" aria-label="示意 SLO 曲線"><line x1="110" y1="230" x2="1320" y2="230" stroke="#60758a"/><line x1="110" y1="25" x2="110" y2="230" stroke="#60758a"/><line x1="110" y1="89" x2="1320" y2="89" stroke="${colors[1]}" stroke-dasharray="8 6"/><text x="110" y="20">TTFT p95（ms）</text><text x="1320" y="75" text-anchor="end">SLO 900 ms</text>${[0,1,2,3,4].map(x=>`<text x="${110+x*290}" y="260" text-anchor="middle">${x}</text>`).join('')}<text x="1350" y="260">RPS</text><polyline points="${[...points].sort((a,b)=>a[0]-b[0]).map(q=>`${110+q[0]*290},${230-q[2]/1200*188}`).join(' ')}" fill="none" stroke="${colors[0]}" stroke-width="4"/>${points.slice(0,s+1).map(q=>`<circle cx="${110+q[0]*290}" cy="${230-q[2]/1200*188}" r="8" fill="${q[1]<=600&&q[2]<=900&&q[3]<=150&&q[4]<=300?colors[0]:'#ff8c80'}"/>`).join('')}</svg><table class="slo-table"><thead><tr><th>Offered RPS</th><th>TTFT mean ≤600</th><th>TTFT p95 ≤900</th><th>ITL mean ≤150</th><th>ITL p95 ≤300</th><th>All Pass</th></tr></thead><tbody><tr>${p.map((v,i)=>`<td>${v}${i?' ms':''}</td>`).join('')}<td class="${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</td></tr></tbody></table><p class="demo-status">${s<4?'粗掃 0.5、1、2、4 RPS，找出最後 PASS 與第一個 FAIL。':s===4?'細掃 3 RPS：四項達標，再往上找。':s===5?'3.5 RPS 失守，邊界縮小到 3–3.5。':'3.25 RPS 的 TTFT 達標，但 ITL 失守。保留 3 RPS，再重複確認。'}</p><p class="caption">全部為教學示意數據。Run-level All Pass 另加 success / timeout / queue 穩定性條件。</p>`;});}
if(name==='users'){
 root.innerHTML='<div class="demo-toolbar"><label>完成率 <input aria-label="完成率" type="range" min="1" max="20" value="8"></label><label>平均 E2E <input aria-label="平均 E2E" type="range" min="1" max="30" value="8"></label><label>Think time <input aria-label="Think time" type="range" min="0" max="60" value="20"></label></div><div class="scene"></div>';
 const draw=()=>{const [x,r,z]=$$('input',root).map(e=>+e.value);$('.scene',root).innerHTML=`<div class="formula">X = ${x} req/s　R = ${r} s　Z = ${z} s</div><div class="metricrow">${metric(x*r,'C = X × R，平均 outstanding')}${metric(x*(r+z),'U = X × (R + Z)，active users','amber')}${metric(x*(r+z)*5,'假設尖峰 active ratio = 20%','purple')}</div><p class="demo-status">前提：相同 workload 已通過 SLO 且系統穩定；每位 user 一次只有一筆 request。</p><p>若「40 秒」代表完整 request 週期，U = X × 40。<br>若它是回答後的 think time，U = X × (R + 40)。</p><p class="caption">以上是使用行為模型試算，沒有量測或保證這些 RPS 能通過 SLO。</p>`;};$$('input',root).forEach(x=>x.oninput=draw);draw();return {pause(){},next(){const r=$$('input',root)[2];r.value=+r.value>=60?0:+r.value+10;draw();},finish:draw};}
if(name==='budget'){
root.innerHTML='<div class="demo-toolbar"><select aria-label="記憶體試算模型"><option value="1">122B-A10B / 1 byte weights</option><option value="2">27B / BF16 weights</option><option value="0">32B / BF16 weights</option></select><label>Context <input type="range" min="1" max="32" value="32" aria-label="記憶體試算 context"></label><span class="readout"></span></div><div class="scene"></div>';
const draw=()=>{const m=+$('select',root).value,t=+$('input',root).value*1024,w=[64,122,54][m],runtime=10,limit=162,left=limit-w-runtime,per=cache(t)[m]*2**30/1e9,c=Math.floor(left/per);$('.readout',root).textContent=t.toLocaleString()+' tokens';$('.scene',root).innerHTML=`<div class="barrow"><span>180 GB 實體容量</span><div class="bartrack" style="display:flex"><div style="width:${w/180*100}%;background:${colors[0]}"></div><div style="width:${runtime/180*100}%;background:${colors[2]}"></div><div style="width:${left/180*100}%;background:${colors[1]}"></div></div><span>90% 預算</span></div><div class="metricrow">${metric(w+' GB','粗估權重')}${metric('10 GB','假設 runtime 預留','purple')}${metric(left+' GB','可用於邏輯 cache','amber')}</div><div class="formula">每條 cache ≈ ${per.toFixed(3)} GB　　⌊${left} / ${per.toFixed(3)}⌋ = ${c}</div><p class="demo-status">${c} 是這組簡化假設下的記憶體上界。SLO concurrency 需要另外測量。</p><p class="caption">固定 BF16 KV / FP32 recurrent state。排除量化 metadata、allocator padding、額外 checkpoints、vision / MTP 差異。不能作為部署承諾。</p>`;};$('select',root).onchange=draw;$('input',root).oninput=draw;draw();return{pause(){},next(){const x=$('input',root);x.value=+x.value>=32?1:Math.min(32,+x.value*2);draw();},finish:draw};}
}
const colors=['#59d8df','#ffc26d','#baabff'];
function cache(t){return [t*262144/2**30,(t*24576+36*64*128*128*4+36*12288*3*2)/2**30,(t*65536+48*48*128*128*4+48*10240*3*2)/2**30];}
$$('.demo').forEach(root=>controllers.set(root.dataset.demo,createDemo(root.dataset.demo,root)));
function preparePrint(){controllers.forEach(c=>c.finish());}
addEventListener('beforeprint',preparePrint);
window.deck={go,slides,controllers,cache,preparePrint,getIndex:()=>index};
go(index);
</script></body></html>
